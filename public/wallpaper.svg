<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f69c2"/>
      <stop offset="0.42" stop-color="#4a98e6"/>
      <stop offset="0.7" stop-color="#97c9f1"/>
      <stop offset="0.88" stop-color="#cfe8fb"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2fbff" stop-opacity="0"/>
      <stop offset="1" stop-color="#f2fbff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8db7d"/>
      <stop offset="1" stop-color="#6aae34"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#84cb4a"/>
      <stop offset="0.5" stop-color="#5fa92b"/>
      <stop offset="1" stop-color="#3c7d14"/>
    </linearGradient>
    <linearGradient id="fore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#68b232"/>
      <stop offset="1" stop-color="#2f6b0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="720" cy="430" rx="400" ry="170" fill="url(#glow)"/>

  <!-- Soft cumulus groups, blurred just enough to feel photographic. -->
  <g fill="#ffffff" filter="url(#soft)">
    <g opacity="0.8">
      <ellipse cx="908" cy="158" rx="92" ry="33"/>
      <ellipse cx="846" cy="149" rx="54" ry="25"/>
      <ellipse cx="962" cy="150" rx="62" ry="24"/>
      <ellipse cx="900" cy="138" rx="40" ry="22"/>
    </g>
    <g opacity="0.52">
      <ellipse cx="246" cy="190" rx="82" ry="25"/>
      <ellipse cx="200" cy="181" rx="42" ry="17"/>
      <ellipse cx="298" cy="182" rx="48" ry="17"/>
    </g>
    <g opacity="0.26">
      <ellipse cx="596" cy="96" rx="108" ry="21"/>
      <ellipse cx="664" cy="88" rx="58" ry="15"/>
    </g>
  </g>

  <!-- A pale band of air just above the horizon. -->
  <rect y="430" width="1200" height="120" fill="url(#haze)"/>

  <!-- Far ridge, seen above the main hill's curve. -->
  <path d="M0 800 L0 552 C 150 522 300 516 470 530 C 660 545 790 502 940 514 C 1060 524 1130 508 1200 500 L1200 800 Z" fill="url(#far)"/>

  <!-- The big hill, cresting right of centre. -->
  <path d="M0 800 L0 624 C 160 604 320 598 470 588 C 630 578 702 458 862 452 C 1012 448 1102 562 1200 550 L1200 800 Z" fill="url(#main)"/>

  <!-- A soft light catch along the crest. -->
  <path d="M470 588 C 630 578 702 458 862 452 C 1012 448 1102 562 1200 550" fill="none" stroke="#a6e069" stroke-width="5" opacity="0.35"/>

  <!-- Darker grass in the foreground. -->
  <path d="M0 800 L0 728 C 200 702 380 714 560 716 C 760 718 980 704 1200 714 L1200 800 Z" fill="url(#fore)"/>
</svg>
