<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3b8c" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="A private personal diary that boots like an old home computer." />
    <meta name="referrer" content="no-referrer" />
    <title>Diary XP</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <style>
      /* ---- Critical CSS: everything needed to paint the boot screen. ---- */
      :root {
        --bios-fg: #e5e7eb;
        --chrome: #1f5fbf;
        --band-dark: #0b3b8c;
        --band-light: #4f7fd0;
        --welcome: #1f5fbf;
        --desktop: #35689c;
        --boot-mono: ui-monospace, "Lucida Console", Consolas, "Courier New", monospace;
        --ui-font: Tahoma, Verdana, "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        font-family: var(--ui-font);
        font-size: 13px;
        color: #111;
        background: #000;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        position: fixed;
        inset: 0;
        background: var(--desktop);
        opacity: 0;
        transition: opacity 140ms linear;
      }

      #app.is-live { opacity: 1; }

      /* ---- Boot overlay ---- */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9000;
        background: #000;
        color: var(--bios-fg);
        font-family: var(--boot-mono);
      }

      #boot[hidden] { display: none; }

      .screen {
        position: absolute;
        inset: 0;
        display: none;
      }

      .screen.is-on { display: block; }

      /* BIOS POST */
      #bios {
        margin: 0;
        padding: 16px;
        font: 13px/1.6 var(--boot-mono);
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--bios-fg);
      }

      #bios .ok { color: #fff; }

      #bios .caret {
        display: inline-block;
        width: 8px;
        background: var(--bios-fg);
        animation: blink 1s steps(1, start) infinite;
      }

      @keyframes blink { 50% { opacity: 0; } }

      /* Splash */
      #splash {
        display: none;
        inset: 0;
        background: #000;
        color: #dfe6f2;
        text-align: center;
      }

      #splash.is-on { display: flex; }

      .splash-inner {
        margin: auto;
        padding: 0 16px;
      }

      .splash-logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        filter: drop-shadow(0 4px 10px rgba(0, 20, 60, 0.55));
      }

      .splash-logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .wordmark {
        font-family: var(--ui-font);
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 6px;
        color: #fff;
      }

      .wordmark span { color: #ffb02e; }

      .wordmark-sub {
        margin-top: 6px;
        font-family: var(--ui-font);
        font-size: 11px;
        letter-spacing: 2px;
        color: #9fb3cc;
      }

      .bar {
        width: 160px;
        height: 20px;
        margin: 30px auto 0;
        padding: 2px 1px;
        border: 2px solid #b2b2b2;
        border-radius: 6px;
        overflow: hidden;
        position: relative;
      }

      .still-booting {
        margin: 12px 0 0;
        font-family: var(--ui-font);
        font-size: 11px;
        letter-spacing: 0.8px;
        color: #8fa3c8;
      }

      .bar-blocks {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        gap: 3px;
        animation: slide 2.2s linear infinite;
      }

      .bar-blocks i {
        width: 8px;
        height: 13px;
        border-radius: 1px;
        background: linear-gradient(to bottom, #2838c7, #5979ef 17%, #869ef3 32%, #869ef3 45%, #5979ef 59%, #2838c7);
      }

      @keyframes slide {
        from { transform: translateX(-34px); }
        to { transform: translateX(172px); }
      }

      .skip-hint {
        position: absolute;
        right: 16px;
        bottom: calc(14px + env(safe-area-inset-bottom));
        font-family: var(--ui-font);
        font-size: 12px;
        color: #6b7f9e;
      }

      /* Welcome */
      #welcome {
        background:
          radial-gradient(120% 100% at 50% 34%, #4f97df 0%, #2166c1 55%, #104a9c 100%);
        color: #fff;
        text-align: center;
      }

      #welcome.is-on { display: flex; }

      #welcome p {
        margin: auto;
        font-family: var(--ui-font);
        font-size: clamp(2.6rem, 6vw, 3.8rem);
        font-weight: 300;
        letter-spacing: 3px;
        text-shadow: 1px 2px 5px rgba(0, 24, 70, 0.55);
        opacity: 0;
        transition: opacity 600ms linear;
      }

      #welcome::after {
        content: 'Diary XP';
        position: absolute;
        left: 24px;
        bottom: 20px;
        font-family: var(--ui-font);
        font-size: 13px;
        font-style: italic;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.75);
      }

      #welcome.is-faded p { opacity: 1; }

      /* Static, instantly skippable boot when motion is reduced. */
      @media (prefers-reduced-motion: reduce) {
        #bios { display: none; }
        .bar-blocks { animation: none; transform: translateX(60px); }
        #welcome p { transition: none; opacity: 1; }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      noscript p {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: #000;
        color: #fff;
        font-family: var(--ui-font);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Diary desktop"></main>

    <div id="boot" role="status" aria-live="polite" aria-label="System boot">
      <!-- 1. BIOS power-on self test -->
      <pre id="bios" class="screen is-on"></pre>

      <!-- 2. Splash with the original book mark and progress bar -->
      <div id="splash" class="screen">
        <div class="splash-inner">
          <div class="splash-logo" aria-hidden="true">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
              <path d="M32 15C25 9 14 9 7 13v39c7-4 18-4 25 2z" fill="#f7faff" stroke="#0b3b8c" stroke-width="2" stroke-linejoin="round"/>
              <path d="M32 15c7-6 18-6 25-2v39c-7-4-18-4-25 2z" fill="#e8f0fb" stroke="#0b3b8c" stroke-width="2" stroke-linejoin="round"/>
              <path d="M13 22h12M13 29h12M13 36h9M39 22h12M39 29h12M39 36h9" stroke="#7b96b8" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M30 11h4v15l-2-2-2 2z" fill="#ffb02e" stroke="#a57312"/>
              <path d="M32 15v39" stroke="#0b3b8c" stroke-width="1.4"/>
            </svg>
          </div>
          <div class="wordmark">DIARY <span>XP</span></div>
          <div class="wordmark-sub">PERSONAL JOURNAL SYSTEM</div>
          <div class="bar" aria-hidden="true">
            <div class="bar-blocks"><i></i><i></i><i></i></div>
          </div>
          <p class="still-booting">still booting… hang tight</p>
        </div>
        <div class="skip-hint">Click, or press Esc, to skip</div>
      </div>

      <!-- 3. Welcome (startup sound plays here) -->
      <div id="welcome" class="screen">
        <p>welcome</p>
      </div>
    </div>

    <noscript><p>This diary needs JavaScript enabled to boot.</p></noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
