
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#003399" />
    <meta name="description" content="A personal diary kept inside a Windows XP desktop." />
    <title>Diary XP</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Critical CSS, inlined so the first frame is the BIOS screen: no stylesheet
      request, no script execution, no layout shift. The boot screens are styled
      only here — everything after them comes from the entry stylesheet, which is
      loaded non-blocking by the plugin in vite.config.ts.
    -->
    <style>
      html {
        background: #000;
      }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Tahoma, Verdana, 'DejaVu Sans', system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      #app {
        position: fixed;
        inset: 0;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
      }

      /* ---- Shared full-screen boot layout. ---- */
      .boot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        user-select: none;
        -webkit-user-select: none;
      }

      /* ---- BIOS / POST. ---- */
      .boot-bios {
        background: #000;
        color: #fff;
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        line-height: 1.35;
        padding: 12px 14px;
        white-space: pre-wrap;
        overflow: hidden;
        align-items: flex-start;
      }
      .boot-bios b {
        font-weight: 700;
      }
      .bios-block {
        width: 100%;
      }
      .bios-cursor {
        display: inline-block;
        width: 7px;
        height: 12px;
        background: #fff;
        vertical-align: -2px;
        animation: blink 1s steps(1, end) infinite;
      }
      .bios-bottom {
        margin-top: auto;
        width: 100%;
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #6b6b6b;
        padding-top: 4px;
      }

      /* ---- XP-style splash: blue field, wordmark, three-block bar. ---- */
      .boot-splash {
        background: #003399;
        align-items: center;
        justify-content: center;
        gap: 26px;
      }
      .splash-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #fff;
      }
      .splash-word {
        font-family: 'Franklin Gothic Medium', 'Trebuchet MS', Tahoma, Verdana, sans-serif;
        font-size: 40px;
        font-weight: 400;
        letter-spacing: -1px;
        line-height: 1;
      }
      .splash-word sup {
        font-size: 15px;
        letter-spacing: 0;
        vertical-align: 14px;
        margin-left: 2px;
      }
      .splash-edition {
        font-size: 13px;
        color: #b9c9f0;
        margin-top: 4px;
      }
      .splash-bar {
        position: relative;
        width: 155px;
        height: 18px;
        border: 1px solid #7f99db;
        background: #08227a;
        overflow: hidden;
      }
      .splash-bar i {
        position: absolute;
        top: 2px;
        left: 0;
        width: 11px;
        height: 12px;
        background: linear-gradient(to right, #9fb4e8, #5f7fc9 60%, #4a6ab5);
        animation: bar-slide 2s linear infinite;
        opacity: 0;
      }
      .splash-bar i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .splash-bar i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bar-slide {
        0% { transform: translate3d(-14px, 0, 0); opacity: 1; }
        78% { transform: translate3d(155px, 0, 0); opacity: 1; }
        82%, 100% { transform: translate3d(155px, 0, 0); opacity: 0; }
      }
      .splash-legal {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        text-align: center;
        font-size: 11px;
        color: #93a7d8;
      }

      /* ---- Logon screen: navy page, inset blue field, hairline rules, centred
         split with the brand left of the divider and the account right of it.
         Layout and measurements taken from the mitchivin.com reference. ---- */
      .boot-login {
        background: #002d99;
        color: #fff;
      }
      .login-inner {
        position: absolute;
        inset: 100px 0;
        background: #587cdb;
      }
      .login-inner::before,
      .login-inner::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
      }
      .login-inner::before {
        top: 0;
        background: linear-gradient(90deg, transparent, #bad7f8, transparent, transparent);
      }
      .login-inner::after {
        bottom: 0;
        background: linear-gradient(90deg, transparent, #f8953d, transparent, transparent);
      }
      .login-center {
        position: relative;
        height: 100%;
      }
      .login-brand {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(calc(-100% - 53px), -50%);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      .login-logo {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .login-word {
        font-size: 62px;
      }
      .login-instruction {
        margin: 12px 28px 0 0;
        font-size: 19px;
        font-weight: 400;
        letter-spacing: 0.25px;
        color: #fff;
      }
      .login-divider {
        position: absolute;
        left: 50%;
        top: 20%;
        bottom: 20%;
        width: 2px;
        transform: translateX(-50%);
        opacity: 0.35;
        background: linear-gradient(
          180deg,
          rgba(186, 215, 248, 0) 0,
          #bad7f8 40%,
          #bad7f8 60%,
          rgba(186, 215, 248, 0)
        );
      }
      .login-right {
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(53px, -50%);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        max-width: calc(50% - 70px);
      }
      .login-tile {
        position: relative;
        isolation: isolate;
        display: flex;
        align-items: flex-start;
        padding: 10px 18px 10px 10px;
        min-width: 260px;
        border-radius: 6px;
        color: #fff;
        text-align: left;
      }
      .login-tile::before,
      .login-tile::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        opacity: 0;
        pointer-events: none;
        transition: opacity 70ms linear;
      }
      .login-tile::before {
        background: linear-gradient(90deg, #113fa6, #194db8 40%, #587cdb);
        z-index: -1;
      }
      .login-tile::after {
        border: 1px solid rgba(186, 215, 248, 0.55);
        -webkit-mask-image: linear-gradient(90deg, #000 0, #000 42%, transparent 92%);
        mask-image: linear-gradient(90deg, #000 0, #000 42%, transparent 92%);
      }
      .login-tile:hover::before,
      .login-tile:hover::after,
      .login-tile:focus-visible::before,
      .login-tile:focus-visible::after {
        opacity: 0.92;
      }
      .login-tile:disabled {
        cursor: default;
      }
      .login-photo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 70px;
        height: 70px;
        flex: none;
        overflow: hidden;
        border: 3px solid #fff;
        border-radius: 3px;
        background: #cbe3ff;
        object-fit: cover;
        box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.06), 1px 2px 3px rgba(0, 0, 0, 0.14);
        transition: border-color 70ms linear;
      }
      .login-tile:hover .login-photo,
      .login-tile:focus-visible .login-photo {
        border-color: #fdbd32;
      }
      .login-text {
        display: flex;
        flex-direction: column;
        margin: 11px 0 0 14px;
        min-width: 0;
      }
      .login-name {
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.25px;
        line-height: 1;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.14);
      }
      .login-sub {
        margin-top: 4px;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.2;
        color: #000c58;
      }
      .login-tile:hover .login-sub,
      .login-tile:focus-visible .login-sub {
        color: #fdbd32;
      }
      .login-note {
        margin: 12px 0 0 4px;
        max-width: 34ch;
        font-size: 12px;
        line-height: 1.45;
        color: #ffe9c9;
      }
      .login-note--info {
        color: #dbe5fb;
      }
      .login-turnoff {
        position: absolute;
        left: 50px;
        bottom: 35px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 500;
        color: #eff1ed;
      }
      .login-turnoff:hover {
        color: #fff;
      }
      .login-detail {
        position: absolute;
        right: 50px;
        bottom: 30px;
        text-align: right;
        font-size: 14px;
        line-height: 1.45;
        color: #eff1ed;
      }

      /* ---- Welcome: the same blue field with a bouncing bar. ---- */
      .boot-welcome {
        background: linear-gradient(to bottom, #5a7edc 0%, #6287e0 50%, #6f93e6 100%);
        align-items: center;
        justify-content: center;
      }
      .welcome-brand {
        display: flex;
        align-items: center;
        gap: 16px;
        color: #fff;
        font-family: 'Franklin Gothic Medium', 'Trebuchet MS', Tahoma, sans-serif;
        font-size: 30px;
        text-shadow: 1px 1px rgba(0, 0, 0, 0.4);
      }

      /* ---- Reduced motion: no sliding blocks, no blink. ---- */
      @media (prefers-reduced-motion: reduce) {
        .splash-bar i {
          animation: none;
          opacity: 1;
        }
        .splash-bar i:nth-child(1) { left: 4px; }
        .splash-bar i:nth-child(2) { left: 20px; }
        .splash-bar i:nth-child(3) { left: 36px; }
        .bios-cursor { animation: none; }
      }

      /* ---- Phones: band collapses, the pair stacks around the centre. ---- */
      @media (max-width: 767px) {
        .login-inner {
          inset: 56px 0;
        }
        .login-brand {
          left: 50%;
          top: 50%;
          transform: translate(-50%, calc(-100% - 34px));
          align-items: center;
          text-align: center;
        }
        /* Absolute children shrink to the space right of `left: 50%` unless told
           otherwise, which would wrap the wordmark and the tile. */
        .login-brand,
        .login-right {
          width: max-content;
          max-width: calc(100vw - 32px);
        }
        .login-logo {
          gap: 10px;
        }
        .login-word {
          font-size: 38px;
        }
        .login-instruction {
          margin: 10px 0 0;
          font-size: 15px;
        }
        .login-divider {
          display: none;
        }
        .login-right {
          left: 50%;
          top: 50%;
          transform: translate(-50%, 34px);
          align-items: center;
          max-width: calc(100% - 24px);
        }
        .login-tile {
          min-width: 0;
          padding: 8px 12px 8px 8px;
        }
        .login-photo {
          width: 56px;
          height: 56px;
        }
        .login-text {
          margin: 8px 0 0 12px;
        }
        .login-name {
          font-size: 20px;
        }
        .login-note {
          margin: 10px 0 0;
          text-align: center;
        }
        .login-turnoff {
          left: 50%;
          bottom: calc(12px + env(safe-area-inset-bottom));
          transform: translateX(-50%);
          font-size: 14px;
        }
        .login-detail {
          display: none;
        }
        .splash-word {
          font-size: 30px;
        }
        .boot-bios {
          font-size: 11px;
          padding: 8px 10px;
        }
      }

      noscript {
        display: block;
        padding: 24px;
        font: 14px Tahoma, Verdana, sans-serif;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Diary XP needs JavaScript: it is a desktop, not a page.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
